<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask your friends · Mast</title>
<meta name="description" content="Send your friends the link to let you out of a Mast lock.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B2F35">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap">

<body>

<div class="band">
<header class="nav">
  <a class="wordmark" href="./">Mast</a>
</header>
</div>

<!-- Opened from the QR code on the computer's lock screen: send the ask to your friends from here. -->
<main class="page unlock">
  <p class="eyebrow">Ask your friends</p>
  <h1 id="title">Send this to your friends</h1>
  <p id="lede">They get a link to let you out early. It opens on your computer by itself once they say yes.</p>

  <div class="card">
    <p id="message"></p>
    <a class="button" id="text" href="#">Text a friend</a>
    <button class="button" id="share" type="button" hidden>Share</button>
    <button class="button light" id="copy" type="button">Copy the message</button>
    <p id="done" hidden>Copied. Paste it to your friends.</p>
  </div>
</main>

<script src="ask.js"></script>
</body>
</html>
