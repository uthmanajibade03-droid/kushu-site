<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mast · Join the waitlist</title>
<meta name="description" content="You meant to sleep at 11. It's 1 AM and you're still scrolling. Mast locks your phone and computer at the times you set.">
<meta name="theme-color" content="#22424A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap">
<link rel="icon" href="img/favicon.png">
<link rel="preload" as="image" href="img/scene-car-field.webp">
<link rel="stylesheet" href="home.css?v=1792338008">
<link rel="stylesheet" href="blossom.css?v=1792338008">
<style>
  /* The waitlist content sits in the hero, like the home page's words. */
  .hero-words.wl { bottom: clamp(36px, 7vh, 80px); display: flex; flex-direction: column; align-items: center; }
  .wl .eyebrow-wl { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: rgba(246,241,234,.78); }
  .wl form { margin: 26px auto 0; width: min(440px, 92vw); display: flex; flex-direction: column; gap: 10px; }
  .wl input[type=email] {
    width: 100%; height: 60px; padding: 0 20px; border-radius: 16px;
    border: 1px solid rgba(246,241,234,.3); background: rgba(246,241,234,.12);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    color: #F6F1EA; font: 500 17px 'Google Sans', system-ui, sans-serif;
  }
  .wl input[type=email]::placeholder { color: rgba(246,241,234,.58); }
  .wl input[type=email]:focus { outline: none; border-color: rgba(246,241,234,.75); }
  .wl button.join {
    width: 100%; height: 60px; border: 0; border-radius: 16px; background: #F6F1EA; color: #1A2C30;
    font: 600 17px 'Google Sans', system-ui, sans-serif; cursor: pointer; transition: transform .15s, opacity .2s;
  }
  .wl button.join:hover { transform: translateY(-1px); }
  .wl button.join:disabled { opacity: .6; transform: none; cursor: default; }
  .wl .note { margin: 2px 2px 0; min-height: 17px; font-size: 13px; color: rgba(246,241,234,.78); }
  .wl .note.bad { color: #ffc4bd; }
  .wl .cta-note { margin: 14px 0 0; font-size: 13px; color: rgba(246,241,234,.82); }
  .wl .done { margin: 26px auto 0; width: min(440px, 92vw); padding: 22px; border-radius: 18px; background: rgba(246,241,234,.12); border: 1px solid rgba(246,241,234,.28); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  .wl .done h2 { margin: 0; font-size: 22px; font-weight: 600; color: #F6F1EA; }
  .wl .done p { margin: 7px 0 0; font-size: 15px; color: rgba(246,241,234,.82); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<script>try { if (localStorage.getItem('mast.scene') === 'blossom') document.body.classList.add('blossom'); } catch (e) {}</script>

<section class="hero" id="top">
  <div class="slides" aria-hidden="true">
    <div class="slide is-on field-only" style="background-image: url('img/scene-car-field.webp')"></div>
    <div class="slide is-on blossom-only" style="background-image: url('img/scene-blossom.webp')"></div>
  </div>

  <header class="nav">
    <a class="wordmark" href="./">Mast</a>
    <nav aria-label="Sections">
      <div class="scene-switch" role="radiogroup" aria-label="Picture">
        <button type="button" role="radio" data-scene="field" aria-label="Field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="11" r="3.5"/><path d="M12 3.5v1.6M5.6 6.1l1.1 1.1M18.4 6.1l-1.1 1.1M3 18h18M6 21h12"/></svg></button>
        <button type="button" role="radio" data-scene="blossom" aria-label="Blossom"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M12 10c-2.4-1.6-2.4-5 0-6 2.4 1 2.4 4.4 0 6zM14 12c1.6-2.4 5-2.4 6 0-1 2.4-4.4 2.4-6 0zM12 14c2.4 1.6 2.4 5 0 6-2.4-1-2.4-4.4 0-6zM10 12c-1.6 2.4-5 2.4-6 0 1-2.4 4.4-2.4 6 0z"/></svg></button>
      </div>
      <a href="./">Home</a>
    </nav>
  </header>

  <div class="hero-words wl">
    <p class="eyebrow-wl">Coming soon</p>
    <h1><span class="strong">Stop relying</span><br><span>on willpower.</span></h1>
    <p class="lede">You meant to sleep at 11. It’s 1 AM, still scrolling. Mast locks your phone and computer at the times you choose.</p>

    <form id="form" novalidate>
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com" required>
      <button class="join" id="submit" type="submit">Join the waitlist</button>
      <p class="note" id="note" role="status"></p>
    </form>

    <section class="done" id="done" hidden>
      <h2>You’re on the list.</h2>
      <p>We’ll email you the moment Mast is ready. No spam, just the one.</p>
    </section>

    <p class="platforms-note">iPhone · Android · Windows · Mac</p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="waitlist.js"></script>
<script>
  // The picture switch: field or blossom, remembered on this device (same as the home page).
  (() => {
    const buttons = [...document.querySelectorAll('.scene-switch button')];
    const show = (scene) => {
      document.body.classList.toggle('blossom', scene === 'blossom');
      document.querySelector('meta[name=theme-color]').setAttribute('content', scene === 'blossom' ? '#632B2E' : '#22424A');
      buttons.forEach((b) => b.setAttribute('aria-checked', String(b.dataset.scene === scene)));
    };
    show(document.body.classList.contains('blossom') ? 'blossom' : 'field');
    buttons.forEach((b) => b.addEventListener('click', () => {
      show(b.dataset.scene);
      try { localStorage.setItem('mast.scene', b.dataset.scene); } catch (e) {}
    }));
  })();
</script>
</body>
</html>
