<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Mast</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px/1.4 -apple-system, 'SF Pro Text', system-ui, sans-serif; background: #f4f1ec; color: #1d1416; }
  @media (prefers-color-scheme: dark) { body { background: #141414; color: #fff; } a { color: #fff; } }
  main { text-align: center; padding: 24px; }
  h1 { margin: 0 0 8px; font: 600 34px -apple-system, 'SF Pro Display', system-ui, sans-serif; letter-spacing: -0.02em; }
  a { display: inline-block; margin-top: 14px; font-weight: 600; color: #1d1416; }
</style>
</head>
<body>
<main>
  <h1>Mast</h1>
  <p id="msg">Opening Mast…</p>
  <a id="open" href="kushu://auth-callback">Open Mast</a>
</main>
<script>
  // Google's sign-in comes back here (the account only returns to kushu.space);
  // the phone app is waiting for the code at kushu://auth-callback.
  var query = location.search || (location.hash ? '?' + location.hash.slice(1) : '');
  var target = 'kushu://auth-callback' + query;
  document.getElementById('open').href = target;
  location.replace(target);
</script>
</body>
</html>
