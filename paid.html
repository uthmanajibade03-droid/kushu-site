<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Mast</title>
<link rel="icon" href="img/favicon.png?v=horseman">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px/1.4 -apple-system, 'SF Pro Text', system-ui, sans-serif; background: #f4f1ec; color: #1d1416; }
  @media (prefers-color-scheme: dark) { body { background: #141414; color: #fff; } a { color: #fff; } }
  main { text-align: center; padding: 24px; max-width: 420px; }
  h1 { margin: 0 0 8px; font: 600 34px -apple-system, 'SF Pro Display', system-ui, sans-serif; letter-spacing: -0.02em; }
  p { margin: 0; opacity: .75; }
  a { display: none; margin-top: 18px; font-weight: 600; color: #1d1416; }
</style>
</head>
<body>
<main>
  <h1 id="title">Mast</h1>
  <p id="msg">One moment…</p>
  <a id="open" href="kushu://">Open Mast</a>
</main>
<script>
  // Stripe comes back here: after paying (?session=…), or from cancelling or
  // managing it (?back=1). Mast on the phone and computer checks again as it opens.
  var SUPABASE_URL = 'https://qnuezqnbcloksugbxbcb.supabase.co';
  var SUPABASE_ANON_KEY =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFudWV6cW5iY2xva3N1Z2J4YmNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDczNzgsImV4cCI6MjEwNjIyMzM3OH0.FHhOTaIbfsue2TFkZ0mn-hBa-6esMuVYZPjCST4i4ig';
  var title = document.getElementById('title');
  var msg = document.getElementById('msg');
  var phone = /iPhone|iPad|Android/i.test(navigator.userAgent);
  function done(t, m) {
    title.textContent = t;
    msg.textContent = m;
    if (phone) document.getElementById('open').style.display = 'inline-block';
  }
  var session = new URLSearchParams(location.search).get('session');
  if (!session) {
    done('Mast', 'You can go back to Mast now.');
  } else {
    fetch(SUPABASE_URL + '/functions/v1/billing', {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, 'content-type': 'application/json' },
      body: JSON.stringify({ action: 'paid', session: session }),
    })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (r.access && (r.access.state === 'paid' || r.access.state === 'free')) done('You’re in.', 'Go back to Mast on your phone or computer.');
        else done('Almost there', 'Stripe is still finishing your payment. Go back to Mast in a minute.');
      })
      .catch(function () { done('You’re in.', 'Go back to Mast on your phone or computer.'); });
  }
</script>
</body>
</html>
